<style>

@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1e1e;--text:#f2f2f2;--muted:#9a9a9a;--accent:#a78bfa;--accent-text:#121212;--border:#333;--danger:#ef5350;--ok:#66bb6a}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:560px}
h1{font-size:20px;margin:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
textarea,input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--accent-text);font-weight:600}
button.g{background:transparent;color:var(--text);border:1px solid var(--border);font-weight:500}
button.d{background:transparent;color:var(--danger);border:1px solid var(--border);font-weight:500}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;background:var(--card);color:var(--muted);border:1px solid var(--border);font-weight:500}
.tabs button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted);font-size:13px}
.code{font-weight:700;font-size:18px;color:var(--accent)}
.g-row{padding:10px 0;border-bottom:1px solid var(--border)}
.g-row:last-child{border-bottom:0}
.g-row .t{display:flex;justify-content:space-between;align-items:center}
.guest{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);font-size:17px;color:var(--text);margin:0}
.guest:last-child{border-bottom:0}
.guest input{width:26px;height:26px;flex:none;padding:0}
.guest.in span{color:var(--ok);font-weight:600}
.big{font-size:28px;font-weight:800;color:var(--accent)}
.qr{display:block;margin:12px auto;width:200px;height:200px;image-rendering:pixelated;border-radius:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:5}
#scan{position:fixed;inset:0;background:#000;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#scan video{width:100%;max-width:420px;border-radius:12px}
#scan p{color:#fff;text-align:center;margin:0}
.tabs button{padding:10px 4px;font-size:13px}
.tabs{overflow-x:auto}.tabs button{flex:0 0 auto;padding:10px 12px;white-space:nowrap}
select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px}
.bb{width:calc(50% - 4px);padding:22px 6px;font-size:22px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--bg);color:var(--text);border:1px solid var(--border);font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.map{overflow:auto;border:1px solid var(--border);border-radius:12px;background:#fff;max-height:72vh}
.map svg{display:block}
.tb{cursor:pointer}
</style>
</head>

function latWord(w){
  var k=anorm(w);if(AR[k])return AR[k];
  var out="",prev=false,i,ch,L,vow;
  for(i=0;i<k.length;i++){ch=k.charAt(i);L=LM[ch];

    vow=(ch==="ا"||ch==="و"||ch==="ي");
    if(vow&&prev){out+=ch==="ا"?"a":ch==="و"?"o":"i";prev=false;}
    else{if(!vow&&prev)out+="a";out+=L;prev=!(ch==="ا"||ch==="ع"||ch==="ء");}
  }
  return cap(out);
}
function latin(s){
  if(!/[\u0600-\u06FF]/.test(s))return cap(s);
  return s.split(/\s+/).map(function(w){return/[\u0600-\u06FF]/.test(w)?latWord(w):cap(w);}).join(" ");

function parse(t){return t.split(/[,\n،]+/).map(function(s){return latin(s.trim());}).filter(Boolean);}

function qrCanvas(text,size){
  var qr=qrcode(0,"M");qr.addData(text);qr.make();
  var n=qr.getModuleCount(),cell=Math.max(1,Math.floor(size/(n+8))),s=cell*(n+8);
  var c=document.createElement("canvas");c.width=c.height=s;var x=c.getContext("2d");

  for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(qr.isDark(r,k))x.fillRect((k+4)*cell,(r+4)*cell,cell,cell);
  return c;
}

var stream=null,timer=null;
function stopscan(){clearInterval(timer);if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}document.getElementById("scan").style.display="none";}
var JSQ=["https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js","https://unpkg.com/jsqr@1.4.0/dist/jsQR.js","https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"];
function loadJsQR(cb){
  if(window.jsQR){if(cb)cb(true);return;}
  var i=0;
  (function next(){
    if(i>=JSQ.length){if(cb)cb(false);return;}
    var sc=document.createElement("script");sc.src=JSQ[i++];
    sc.onload=function(){if(window.jsQR){if(cb)cb(true);}else next();};
    sc.onerror=next;
    document.head.appendChild(sc);
  })();
}
function scan(){
  var box=document.getElementById("scan"),m=document.getElementById("scanmsg"),v=document.getElementById("vid");
  box.style.display="flex";m.textContent="Point at a group’s QR code";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){m.textContent="Camera isn’t available here. Use the search box and type the code.";return;}
  var det=("BarcodeDetector" in window)?new BarcodeDetector({formats:["qr_code"]}):null;
  if(!det&&!window.jsQR){m.textContent="Loading scanner…";loadJsQR(function(ok){if(ok)scan();else m.textContent="Couldn’t load the scanner. Check your internet and reload, or use the search box.";});return;}
  var cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  function found(raw){var mt=String(raw).match(/G-\d+/i);if(!mt)return;var c=mt[0].toUpperCase();if(G[c]){stopscan();open=c;editing=false;render();}else{m.textContent=c+" not found";}}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}}).then(function(s){
    stream=s;v.srcObject=s;v.play();
    timer=setInterval(function(){
      if(v.readyState<2)return;
      if(det){det.detect(v).then(function(r){if(r.length)found(r[0].rawValue);}).catch(function(){});}
      else{var w0=v.videoWidth,h0=v.videoHeight;if(!w0)return;var sc=Math.min(1,640/w0);cv.width=Math.round(w0*sc);cv.height=Math.round(h0*sc);cx.drawImage(v,0,0,cv.width,cv.height);var im=cx.getImageData(0,0,cv.width,cv.height),res=jsQR(im.data,im.width,im.height);if(res)found(res.data);}
    },300);
  }).catch(function(){m.textContent="Camera is blocked. Allow camera access for this site, or use the search box.";});
}
function tick(code,id,val){var o={};o[id]=val;return w(function(){return setDoc(R("arrivals",code),{in:o},{merge:true});});}
